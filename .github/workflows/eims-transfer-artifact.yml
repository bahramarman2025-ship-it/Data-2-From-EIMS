name: EIMS XLSX Transfer Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-xlsx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload RooMizi workbook as artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomizi-projects-audits-xlsx
          path: "Bank-Projects- Ausits-Roomizi.xlsx"
          if-no-files-found: error
          retention-days: 7
